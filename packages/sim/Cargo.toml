[package]
name = "structura-sim"
version = "0.1.0"
edition = "2024"
description = "Discrete-event load simulator for Structura diagrams, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
# cdylib for the WebAssembly module, rlib so `cargo test` can link the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
