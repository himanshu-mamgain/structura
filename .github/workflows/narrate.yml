# Voices Structura's narration with Sarvam Bulbul v3 (Indian English) and opens a pull
# request with the audio. Run it by hand from the Actions tab. The audio is generated
# here, once, and committed: the app itself never calls Sarvam.
#
# Needs a repository secret SARVAM_API_KEY (Settings → Secrets and variables → Actions).
#
#   samples: one passage read by several speakers, at /voice-samples/ on the PR's deploy
#            preview, for choosing a narrator (that PR is for listening, not merging)
#   lessons: the Listen tab's audio lessons
#   videos:  the automatic topic videos (rendered with Remotion; a few minutes each)
#   both:    lessons and videos
name: Narrate with Sarvam Bulbul

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to voice
        type: choice
        options: [samples, lessons, videos, both]
        default: samples
      speaker:
        description: Bulbul v3 speaker (lowercase, e.g. shubh, aditya, priya)
        default: shubh
      pace:
        description: Pace, 0.5 to 2.0
        default: '1.0'
      topics:
        description: Topic ids separated by spaces (empty = all; for samples, speakers to compare)
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: narrate
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      TTS_ENGINE: sarvam
      TTS_VOICE: ${{ inputs.speaker }}
      TTS_PACE: ${{ inputs.pace }}
      TOPICS: ${{ inputs.topics }}
      # Bulbul's limit on pay-as-you-go is 60 requests a minute; Pro allows 200.
      SARVAM_RPM: 55
    steps:
      - name: Check the key
        run: |
          if [ -z "$SARVAM_API_KEY" ]; then
            echo "::error::Add a repository secret named SARVAM_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bulbul clips are cached by speaker, pace and text, so re-runs only pay for new lines.
      - uses: actions/cache/restore@v4
        with:
          path: apps/video/.cache/sarvam
          key: sarvam-${{ inputs.speaker }}-${{ inputs.pace }}-${{ github.run_id }}
          restore-keys: sarvam-${{ inputs.speaker }}-${{ inputs.pace }}-

      - name: Samples
        if: inputs.what == 'samples'
        working-directory: apps/video
        run: node scripts/sarvam-samples.mjs $TOPICS

      - name: Audio lessons
        if: inputs.what == 'lessons' || inputs.what == 'both'
        working-directory: apps/web
        run: npx tsx scripts/lessons.ts --engine=sarvam --voice="$TTS_VOICE" --speed="$TTS_PACE" $TOPICS

      - name: Topic videos
        if: inputs.what == 'videos' || inputs.what == 'both'
        run: |
          npm run export:videos -w @structura/web -- $TOPICS
          npm run topics -w @structura/video -- $TOPICS

      # Saved even when a step fails (say, the Sarvam balance runs out), so clips already
      # paid for are reused by the next run instead of bought again.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: apps/video/.cache/sarvam
          key: sarvam-${{ inputs.speaker }}-${{ inputs.pace }}-${{ github.run_id }}

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
        run: |
          branch="narration/${WHAT}-${TTS_VOICE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A apps/web/public apps/web/src/learn/lessons.json apps/web/src/topics/videos.json apps/video/src/narration apps/video/src/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "feat: voice ${WHAT} with Sarvam Bulbul v3 (${TTS_VOICE})"
          git push -u origin "$branch"
          if [ "$WHAT" = "samples" ]; then
            body="Narrator samples from Sarvam Bulbul v3 (pace ${TTS_PACE}). Listen at /voice-samples/index.html on this PR's deploy preview. For choosing a voice only: close without merging."
          else
            body="Narration for ${WHAT} voiced with Sarvam Bulbul v3, speaker ${TTS_VOICE}, pace ${TTS_PACE}, topics: ${TOPICS:-all}. Generated by the Narrate with Sarvam Bulbul workflow, run ${GITHUB_RUN_ID}."
          fi
          # Creating PRs with the workflow token needs "Allow GitHub Actions to create and approve
          # pull requests" in Settings → Actions → General; without it the branch is still pushed.
          gh pr create --base main --head "$branch" --title "feat: voice ${WHAT} with Sarvam Bulbul v3 (${TTS_VOICE})" --body "$body" \
            || echo "::warning::Pushed $branch but couldn't open a PR with the workflow token. Open it from the branch, or allow Actions to create pull requests."
