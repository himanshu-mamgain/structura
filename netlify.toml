# Netlify hosts the whole app: a static PWA with no server and no API keys.
# Diagrams, the WASM load simulator, quizzes and progress all run in the browser.
[build]
  base = ""
  command = "npm run build -w @structura/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker and manifest must always be revalidated so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Videos and their thumbnails change only when re-rendered: cache for a day.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Hashed build assets never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
